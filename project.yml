name: iRead
options:
  # Same prefix as the bundle IDs below.
  bundleIdPrefix: com.aftrhours
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Marks the project as checked against this Xcode, so it stops asking to "Update to recommended settings".
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Shanon Giuly Istanto's team, which owns the app and its iCloud container.
    DEVELOPMENT_TEAM: X7WUH4Z65U
    CODE_SIGN_STYLE: Automatic
    # Xcode 27's recommended settings that don't change how the code behaves.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  # Reads EPUB files (brings in ZIPFoundation itself). Lives in this repo, under Packages/.
  EPUBKit:
    path: Packages/EPUBKit
  # Finds phrases worth underlining and the earlier passage that explains each one. Lives in its own repo.
  # Pinned to one commit, so every build (and Xcode Cloud, which only reads the committed Package.resolved) uses the same code.
  # To update it on purpose: put the new commit hash here, run `xcodegen generate`, open the project once so Xcode
  # re-resolves packages, then commit project.yml and iRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved together.
  UnderlineEngine:
    url: https://github.com/AftrHours/UnderlineEngine
    # Bump UnderlineRepoKnobs.engineVersion when you change this revision.
    revision: 25e0ff6c10b8037f1212702a6e114985002ba4d0
  # Runs SwiftLint on every build, using the rules in .swiftlint.yml. Xcode asks once to "Trust & Enable" it.
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.65.1
# The test plans sit next to the project and are listed in it, so Xcode's Test navigator finds their targets.
fileGroups:
  - Unit.xctestplan
  - Full.xctestplan
targets:
  iRead:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/UnderlineSeed"
      # Underlines worked out ahead for the bundled books, one folder per book fingerprint. Copied as one folder, because
      # every book has its own chapter-0.json and loose files would clash in the app bundle.
      - path: App/Resources/UnderlineSeed
        type: folder
      # Code the Share extension uses too (book lookup, pending imports, the library index).
      - path: Shared
    dependencies:
      - package: EPUBKit
      - package: UnderlineEngine
      - target: iReadShare
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    # iCloud through CloudKit: the reader's saved underlines (their private database) and the ratings they share (the public one).
    # The container ID must match CloudSvcCloudKit.containerID. See docs/ICLOUD.md for the CloudKit Console steps.
    # The App Group is the folder the app shares with the Share extension: books waiting to be imported, and the library index.
    entitlements:
      path: App/iRead.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.aftrhours.reader
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.aftrhours.reader
    # "Open in iRead" for EPUB files from Files, Safari, Mail and AirDrop. Alternate: Apple Books stays the default.
    # Not opened in place: iOS copies the file into Documents/Inbox, the same copy-in import as the picker.
    # Xcode merges this file with the INFOPLIST_KEY_* settings below (GENERATE_INFOPLIST_FILE).
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        LSSupportsOpeningDocumentsInPlace: false
        # The app only uses the system's HTTPS and CloudKit, so it is exempt. Without this key, every upload to
        # App Store Connect asks the export-compliance question again.
        ITSAppUsesNonExemptEncryption: false
        # Read from the build settings below, so the app and its extension always carry the same version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        # App identity. Renaming is a one-line edit here.
        # - Display name (the name under the app icon): can change any time.
        # - Bundle ID: must NEVER change after the first upload to App Store Connect, which ties the app to it.
        #   Keep it a literal value (not $(VAR) or an .xcconfig): Xcode Cloud reads it from the project as written.
        #   iReadTests uses this ID + ".tests".
        PRODUCT_BUNDLE_IDENTIFIER: com.aftrhours.reader
        INFOPLIST_KEY_CFBundleDisplayName: Refrn
        # The home screen icon: AppIcon in Assets.xcassets, with a light (Any) and a dark version.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Refrn uses speech recognition to search your library by voice."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Refrn uses the microphone when you tap voice search."
        # Universal: 1 = iPhone, 2 = iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        # iPhone: portrait only, like a book held in one hand.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad apps must support every orientation (required for iPad windowing and multitasking).
        # Set for iPad and in general, because Xcode's check reads the general one.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # The Share extension: Share Book in Apple Books → iRead finds the free Project Gutenberg edition and leaves it for the app.
  # Bundle ID: the app's + ".share", kept literal for the same Xcode Cloud reason as the app's. Versions must equal the app's.
  iReadShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Refrn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    # Only the App Group: the extension never talks to iCloud.
    entitlements:
      path: ShareExtension/iReadShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aftrhours.reader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aftrhours.reader.share
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Unit tests (Swift Testing), run inside the app on an iPhone or iPad simulator. Folders mirror App/.
  iReadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/make-fixtures.sh"
    dependencies:
      - target: iRead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aftrhours.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
# Shared, so Xcode Cloud sees it. It keeps the default Archive action: Xcode Cloud only lists products whose scheme can archive.
schemes:
  iRead:
    build:
      targets:
        iRead: all
        iReadTests: [test]
    test:
      # Listed here as well as in the plans, the way Xcode itself writes a scheme: Xcode's Test navigator reads it from here.
      targets:
        - name: iReadTests
          parallelizable: true
      # Unit (the default) skips tests tagged .golden; Full runs everything. Code coverage is set in the plans.
      testPlans:
        - path: Unit.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
